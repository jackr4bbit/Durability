[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "durability"
dynamic = ["version"]
description = "A Python persistance library."
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Jack Huey", email = "jhhuey@icloud.com" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/jackr4bbit/Durability"

[tool.setuptools]
packages.find = { where = ["src"] }

[tool.setuptools_scm]